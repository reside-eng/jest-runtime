name: Release

on:
  push:
    branches:
      - main
      - next
      - next-major
      - alpha
      - beta
      # N.x (maintenance release branches)
      - '[0-9]+.x'

concurrency:
  group: release-${{ github.ref }}

env:
  NODE_VERSION: 24.x

jobs:
  publish:
    name: publish
    # npm Trusted Publishing: the job's OIDC token is exchanged for a short-lived npm token (GitHub-hosted runners only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags and GitHub releases
      issues: write # @semantic-release/github comments and labels
      pull-requests: write # @semantic-release/github comments and labels
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          # Never add registry-url here: setup-node < v7 then exports a dummy NODE_AUTH_TOKEN that breaks OIDC publishing

      # Read token only: publishing itself goes through the OIDC exchange done by npm >= 11.5.1 (bundled with Node 24)
      - name: Configure package manager
        run: |
          npm config set '//registry.npmjs.org/:_authToken' "$NPM_READ_TOKEN"
          npm whoami
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic
        with:
          semantic_version: ^24
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notification:
    if: always()
    name: notification
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3

      - uses: reside-eng/workflow-status-notification-action@v1
        with:
          current-status: ${{ env.WORKFLOW_CONCLUSION }}
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_PLATFORM_PROD }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
